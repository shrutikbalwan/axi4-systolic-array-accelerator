name: ci

on:
  push:
  pull_request:

env:
  # The OSS CAD Suite release the design was verified against. Pinning it means
  # CI runs the same Verilator, Icarus, Yosys and cocotb as a local run.
  OSS_CAD_SUITE_VERSION: "2026-09-22"

jobs:
  checks:
    name: lint, synth, simulate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # ~1 GB: cached, or every run spends minutes downloading it. The cache key
      # includes the Python deps installed into the suite below.
      - name: Cache OSS CAD Suite
        id: cache-oss
        uses: actions/cache@v4
        with:
          path: ~/tools/oss-cad-suite
          key: oss-cad-suite-linux-x64-${{ env.OSS_CAD_SUITE_VERSION }}-numpy-cocotbext-axi

      - name: Install OSS CAD Suite
        if: steps.cache-oss.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/tools
          stamp=$(echo "${OSS_CAD_SUITE_VERSION}" | tr -d '-')
          url="https://github.com/YosysHQ/oss-cad-suite-build/releases/download/${OSS_CAD_SUITE_VERSION}/oss-cad-suite-linux-x64-${stamp}.tgz"
          echo "$url"
          curl -fsSL "$url" -o /tmp/oss-cad-suite.tgz
          tar xzf /tmp/oss-cad-suite.tgz -C ~/tools
          # The suite's tools run its own bundled Python; the tests need these.
          ~/tools/oss-cad-suite/bin/tabbypip install numpy cocotbext-axi

      - name: Add tools to PATH
        run: echo "$HOME/tools/oss-cad-suite/bin" >> "$GITHUB_PATH"

      - name: Tool versions
        run: |
          verilator --version
          iverilog -V 2>&1 | head -1
          yosys -V
          cocotb-config --version
          tabbypy3 -c "import numpy, cocotbext.axi; print('numpy', numpy.__version__)"

      - name: Lint, array regression, synthesis, cocotb regression
        run: scripts/run_checks.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            build/*.log
            build/*.stat
            sim/results_*.xml
