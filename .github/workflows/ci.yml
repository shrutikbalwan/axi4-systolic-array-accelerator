name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    name: lint, synth, simulate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Verilator, Icarus, Yosys and a Python with cocotb 2.1, pinned to the
      # release the design was verified with.
      - uses: YosysHQ/setup-oss-cad-suite@v3
        with:
          version: "2026-09-22"

      # The suite's tools run its bundled Python; install the test deps there.
      - name: Python test dependencies
        run: tabbypip install numpy cocotbext-axi

      - name: Tool versions
        run: |
          verilator --version
          iverilog -V 2>&1 | head -1
          yosys -V
          cocotb-config --version

      - name: Lint, array regression, synthesis, cocotb regression
        run: scripts/run_checks.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            build/*.log
            build/*.stat
            sim/results_*.xml
