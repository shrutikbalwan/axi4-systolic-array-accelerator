name: accelerator-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install HDL tools
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ github.token }}
          python-override: true

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip numpy cocotb cocotbext-axi
          tabbypy3 -m pip install --upgrade --pre 'cocotb>=2.1.0.dev3' cocotbext-axi 'numpy<2'

      - name: Run complete local check suite
        run: ./scripts/run_checks.sh

      - name: Upload check artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: check-results
          path: |
            build/**/*.log
            build/**/*.txt
            sim/results_*.xml

  mutation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install HDL tools
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ github.token }}
          python-override: true

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip numpy cocotb cocotbext-axi
          tabbypy3 -m pip install --upgrade --pre 'cocotb>=2.1.0.dev3' cocotbext-axi 'numpy<2'

      - name: Reject surviving RTL mutants
        run: ./scripts/run_mutants.sh icarus

  formal:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      # OSS CAD Suite ships version-matched yosys, sby, yosys-smtbmc and the
      # SMT solvers (yices, z3, boolector). Cloning the sby repo alone does not
      # put an sby executable on PATH, and apt's yosys lacks yices.
      - name: Install formal tools
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ github.token }}

      - name: Show formal tool versions
        run: |
          yosys -V
          sby --help | head -n 1

      - name: Prove AXI-Lite response properties
        working-directory: formal
        run: sby -f axi_lite_slave.sby

      - name: Prove ping-pong ownership properties
        working-directory: formal
        run: sby -f ping_pong_bank_manager.sby
