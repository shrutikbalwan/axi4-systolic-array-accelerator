name: accelerator-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  software-and-rtl:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        n: [4, 8]

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      # Ubuntu's apt Verilator (5.020) is older than cocotb 2.x requires
      # (>= 5.036), so take a current iverilog/verilator/yosys from OSS CAD Suite.
      - name: Install HDL tools
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install verification dependencies
        run: python -m pip install --upgrade pip numpy cocotb cocotbext-axi

      - name: Run ML reference tests
        run: python -m unittest discover -s ml -p 'test_*.py'

      - name: Compile portable driver
        run: gcc -std=c11 -Wall -Wextra -Werror -Isw -c sw/test_compile.c -o /tmp/driver_test.o

      - name: Run core Cocotb regressions
        working-directory: sim
        env:
          N: ${{ matrix.n }}
          KMAX: 16
        run: |
          make SIM=icarus TB=array
          make SIM=icarus TB=accel
          make SIM=icarus TB=tile
          make SIM=icarus TB=scheduler
          make SIM=icarus TB=chain
          make SIM=icarus TB=read_dma
          make SIM=icarus TB=write_dma
          make SIM=icarus TB=tiled
          make SIM=icarus TB=ml_core
          make SIM=icarus TB=stream_gemm
          make SIM=icarus TB=descriptor
          make SIM=icarus TB=ml_packer

      - name: Run Verilator array regression
        working-directory: sim
        env:
          N: ${{ matrix.n }}
          KMAX: 16
        run: make SIM=verilator TB=array

      - name: Upload simulator artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cocotb-results-n${{ matrix.n }}
          path: |
            sim/results.xml
            sim/sim_build/**/*.log

  lint-and-synthesis:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install HDL tools
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ github.token }}

      - name: Show HDL tool versions
        run: |
          verilator --version
          yosys -V

      - name: Lint connected tiled top
        run: |
          verilator --lint-only -Wall --quiet-stats \
            -Wno-WIDTHTRUNC -Wno-WIDTHEXPAND -Wno-BLKSEQ \
            -Wno-UNUSEDSIGNAL -Wno-UNUSEDPARAM \
            -GARRAY_N=4 -GMAX_M=64 -GMAX_N=64 -GMAX_K=64 \
            rtl/pe_mac.sv rtl/systolic_array.sv rtl/ml_int8_packer.sv \
            rtl/tile_scheduler.sv rtl/tile_accumulator.sv \
            rtl/systolic_tile_adapter.sv rtl/tiled_compute_chain.sv \
            rtl/tiled_gemm_controller.sv rtl/tiled_matrix_tile_buffer.sv \
            rtl/tiled_stream_gemm_top.sv rtl/axi4_read_dma.sv \
            rtl/axi4_write_dma.sv rtl/dma_descriptor_ctrl.sv \
            rtl/tiled_dma_shell.sv rtl/tiled_axi4_gemm_top.sv \
            --top-module tiled_axi4_gemm_top

      - name: Generic synthesis smoke test
        run: |
          yosys -q -p 'read_verilog -sv rtl/pe_mac.sv rtl/systolic_array.sv rtl/reset_sync.sv rtl/ml_postprocess.sv rtl/ml_int8_packer.sv rtl/tile_scheduler.sv rtl/dual_bank_buffer.sv rtl/ping_pong_bank_manager.sv rtl/tile_accumulator.sv rtl/axi4_read_dma.sv rtl/axi4_write_dma.sv rtl/dma_descriptor_ctrl.sv rtl/systolic_tile_adapter.sv rtl/tiled_compute_chain.sv rtl/tiled_gemm_controller.sv rtl/tiled_matrix_tile_buffer.sv rtl/tiled_stream_gemm_top.sv rtl/tiled_dma_shell.sv rtl/tiled_axi4_gemm_top.sv rtl/axi_lite_slave.sv rtl/accel_ctrl.sv rtl/systolic_accel_top.sv; chparam -set N 4 systolic_accel_top; synth -top systolic_accel_top -flatten; check -assert'

  formal:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      # OSS CAD Suite ships version-matched yosys, sby, yosys-smtbmc and the
      # SMT solvers (yices, z3, boolector). Cloning the sby repo alone does not
      # put an `sby` executable on PATH, and apt's yosys lacks yices.
      - name: Install formal tools
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ github.token }}

      - name: Show formal tool versions
        run: |
          yosys -V
          sby --help | head -n 1

      - name: Prove AXI-Lite response properties
        working-directory: formal
        run: sby -f axi_lite_slave.sby

      - name: Prove ping-pong ownership properties
        working-directory: formal
        run: sby -f ping_pong_bank_manager.sby
