name: accelerator-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fpga-implementation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install FPGA implementation tools
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ github.token }}

      - name: Implement documented ECP5 configurations
        run: ./scripts/fpga_report.sh

      - name: Upload FPGA implementation reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fpga-implementation-reports
          path: build/fpga_report/

  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install HDL tools
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ github.token }}
          python-override: true

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip numpy cocotb cocotbext-axi
          tabbypy3 -m pip install --upgrade --pre 'cocotb>=2.1.0.dev3' cocotbext-axi 'numpy<2'

      - name: Run complete local check suite
        run: ./scripts/run_checks.sh

      - name: Upload check artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: check-results
          path: |
            build/**/*.log
            build/**/*.txt
            sim/results_*.xml

  mutation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install HDL tools
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ github.token }}
          python-override: true

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip numpy cocotb cocotbext-axi
          tabbypy3 -m pip install --upgrade --pre 'cocotb>=2.1.0.dev3' cocotbext-axi 'numpy<2'

      - name: Reject surviving RTL mutants
        run: ./scripts/run_mutants.sh icarus

  formal:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      # OSS CAD Suite ships version-matched yosys, sby, yosys-smtbmc and the
      # SMT solvers (yices, z3, boolector). Cloning the sby repo alone does not
      # put an sby executable on PATH, and apt's yosys lacks yices.
      - name: Install formal tools
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ github.token }}

      - name: Show formal tool versions
        run: |
          yosys -V
          sby --help | head -n 1

      - name: Prove AXI-Lite response properties
        working-directory: formal
        run: sby -f axi_lite_slave.sby

      - name: Prove AXI4 DMA source properties
        working-directory: formal
        run: |
          sby -f axi4_read_dma.sby
          sby -f axi4_write_dma.sby

      - name: Prove ping-pong ownership properties
        working-directory: formal
        run: sby -f ping_pong_bank_manager.sby

  riscv-soc:
    # Boots a VexRiscv LiteX SoC in Verilator with tiled_axi4_gemm_top on the
    # bus, runs the bare-metal firmware in soc/firmware and fails unless the
    # INT8 digits MLP is bit-exact with the Python golden model.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        array_n: [4, 8]
        mem_port: [direct]
        include:
          # The original path through the CPU interconnect stays tested too.
          - array_n: 4
            mem_port: bus
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Verilator
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ github.token }}

      - name: Install RISC-V toolchain and simulator libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-unknown-elf libevent-dev libjson-c-dev meson ninja-build

      - name: Install pinned LiteX stack
        run: bash soc/install_litex.sh

      - name: Build SoC + firmware and run the simulation
        run: python3 soc/run_soc_sim.py --array-n ${{ matrix.array_n }} --mem-port ${{ matrix.mem_port }}

      - name: Upload SoC console and results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: riscv-soc-n${{ matrix.array_n }}-${{ matrix.mem_port }}
          path: |
            build/soc/n*/console.log
            build/soc/n*/results.json
